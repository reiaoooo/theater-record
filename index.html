<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>当落一括確認ツール</title>

<style>
  body {
    font-family: sans-serif;
    padding: 20px;
  }

  .account-block {
    border: 1px solid #ccc;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
  }

  input, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  /* 受付番号の例を縦に揃える */
  textarea {
    height: 100px;
    white-space: pre;
    font-family: monospace;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    margin-right: 10px;
  }

  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: fixed;
    margin-top: 10px;
  }

  .result-table th, .result-table td {
    border: 1px solid #ccc;
    padding: 6px;
    word-wrap: break-word;
    text-align: center;
  }

  .win { background: #d8f5d0; }
  .lose { background: #f5d0d0; }
  .unknown { background: #eee; }

  .total-sum {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
  }

  .account-result {
    margin-bottom: 40px;
  }
</style>
</head>

<body>

<h2>当落一括確認ツール</h2>

<div id="accounts"></div>

<button id="add">＋ アカウント追加</button>
<button id="run">一括確認する</button>

<h2 style="margin-top:40px;">結果</h2>
<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
