<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>観劇記録</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       ホーム画面
  ========================= -->

  <main id="homeScreen">

    <header>
      <h1>観劇記録</h1>
    </header>


    <div class="home-content">

      <!-- 集計 -->

      <section class="summary">

        <div class="summary-box">
          <span>作品</span>
          <strong id="workCount">0</strong>
        </div>

        <div class="summary-box">
          <span>公演</span>
          <strong id="performanceCount">0</strong>
        </div>

        <div class="summary-box">
          <span>総額</span>
          <strong id="totalPrice">0円</strong>
        </div>

      </section>


      <!-- 最近の観劇 -->

      <section>

        <h2>最近の観劇</h2>

        <div id="recentRecords" class="record-list">

          <div class="empty">
            まだ観劇記録がありません
          </div>

        </div>

      </section>


      <!-- 作品 -->

      <section class="list-section">

        <div class="section-title">
          <h2>作品</h2>
        </div>

        <div id="workList"></div>

      </section>


      <!-- 劇場 -->

      <section class="list-section">

        <div class="section-title">
          <h2>劇場</h2>
        </div>

        <div id="theaterList"></div>

      </section>


      <button
        class="add-button"
        id="addButton"
      >
        ＋ 観劇を記録
      </button>

    </div>

  </main>


  <!-- =========================
       追加・編集画面
  ========================= -->

  <section
    class="add-screen"
    id="addScreen"
  >

    <div class="screen-content">

      <button
        class="back-button"
        id="backButton"
      >
        ‹ 戻る
      </button>


      <h2 id="formTitle">
        観劇を記録
      </h2>


      <form id="recordForm">

        <!-- 作品 -->

        <label>
          作品

          <input
            type="text"
            id="title"
            placeholder="作品名"
            required
          >
        </label>


        <!-- 公演 -->

        <label>
          公演

          <input
            type="text"
            id="performance"
            placeholder="公演名"
            required
          >
        </label>


        <!-- 観劇日 -->

        <label>
          観劇日

          <input
            type="date"
            id="date"
            required
          >
        </label>


        <!-- 劇場 -->

        <label>
          劇場

          <input
            type="text"
            id="theater"
            placeholder="例：日本青年館ホール"
            required
          >
        </label>


        <!-- 座席 -->

        <label>
          座席

          <input
            type="text"
            id="seat"
            placeholder="例：1階 10列 15番"
          >
        </label>


        <!-- チケット代 -->

        <label>
          チケット代

          <div class="price-input">

            <input
              type="number"
              id="price"
              placeholder="例：9800"
              min="0"
            >

            <span>円</span>

          </div>

        </label>


        <!-- 座席の見やすさ -->

        <label>
          座席の見やすさ

          <select id="seatRating">

            <option value="5">
              ★★★★★
            </option>

            <option value="4">
              ★★★★☆
            </option>

            <option value="3">
              ★★★☆☆
            </option>

            <option value="2">
              ★★☆☆☆
            </option>

            <option value="1">
              ★☆☆☆☆
            </option>

          </select>

        </label>


        <!-- 座席の感想 -->

        <label>
          座席の感想

          <textarea
            id="seatImpression"
            placeholder="この座席からの見え方や、見やすさを記録"
          ></textarea>

        </label>


        <!-- 作品の感想 -->

        <label>
          作品の感想

          <textarea
            id="workImpression"
            placeholder="作品・公演についての感想を記録"
          ></textarea>

        </label>


        <button
          type="submit"
          class="save-button"
        >
          保存する
        </button>

      </form>

    </div>

  </section>


  <!-- =========================
       作品詳細画面
  ========================= -->

  <section
    class="work-detail-screen"
    id="workDetailScreen"
  >

    <div class="screen-content">

      <button
        class="back-button"
        id="workDetailBackButton"
      >
        ‹ 戻る
      </button>


      <div id="workDetailContent"></div>

    </div>

  </section>


  <!-- =========================
       劇場詳細画面
  ========================= -->

  <section
    class="theater-detail-screen"
    id="theaterDetailScreen"
  >

    <div class="screen-content">

      <button
        class="back-button"
        id="theaterDetailBackButton"
      >
        ‹ 戻る
      </button>


      <div id="theaterDetailContent"></div>

    </div>

  </section>


  <!-- =========================
       観劇詳細画面
  ========================= -->

  <section
    class="detail-screen"
    id="detailScreen"
  >

    <div class="screen-content">

      <button
        class="back-button"
        id="detailBackButton"
      >
        ‹ 戻る
      </button>


      <div id="detailContent"></div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
