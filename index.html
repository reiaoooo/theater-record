<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>観劇記録</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       トップ画面
  ========================= -->

  <main id="homeScreen">

    <header>
      <h1>観劇記録</h1>
    </header>

    <section class="summary">

      <div class="summary-box">
        <span>作品</span>
        <strong>0</strong>
      </div>

      <div class="summary-box">
        <span>公演</span>
        <strong>0</strong>
      </div>

      <div class="summary-box">
        <span>総額</span>
        <strong>0円</strong>
      </div>

    </section>


    <!-- 最近の観劇 -->

    <section>
      <h2>最近の観劇</h2>

      <div class="empty">
        まだ観劇記録がありません
      </div>

    </section>


    <!-- 作品一覧 -->

    <section class="work-section">

      <h2>作品</h2>

      <div id="workList"></div>

    </section>


    <button class="add-button" id="addButton">
      ＋ 観劇を記録
    </button>

  </main>


  <!-- =========================
       観劇記録 追加・編集画面
  ========================= -->

  <section class="add-screen" id="addScreen">

    <button class="back-button" id="backButton">
      ‹ 戻る
    </button>

    <h2 id="formTitle">観劇を記録</h2>


    <form id="recordForm">

      <!-- 作品 -->

      <label>
        作品
        <input
          type="text"
          id="title"
          placeholder="作品名"
          required
        >
      </label>


      <!-- 公演 -->

      <label>
        公演
        <input
          type="text"
          id="performance"
          placeholder="公演名"
          required
        >
      </label>


      <!-- 観劇日 -->

      <label>
        観劇日
        <input
          type="date"
          id="date"
          required
        >
      </label>


      <!-- 劇場 -->

      <label>
        劇場
        <input
          type="text"
          id="theater"
          placeholder="劇場名を入力"
        >
      </label>


      <!-- 座席 -->

      <label>
        座席
        <input
          type="text"
          id="seat"
          placeholder="例：1階 10列 15番"
        >
      </label>


      <!-- チケット代 -->

      <label>
        チケット代

        <div class="price-input">

          <input
            type="number"
            id="price"
            placeholder="例：9800"
            min="0"
          >

          <span>円</span>

        </div>

      </label>


      <!-- 感想 -->

      <label>
        感想

        <textarea
          id="impression"
          placeholder="感想を入力"
        ></textarea>

      </label>


      <button
        type="submit"
        class="save-button"
      >
        保存する
      </button>

    </form>

  </section>


  <!-- =========================
       作品詳細画面
  ========================= -->

  <section
    class="work-detail-screen"
    id="workDetailScreen"
  >

    <button
      class="back-button"
      id="workDetailBackButton"
    >
      ‹ 戻る
    </button>

    <div id="workDetailContent"></div>

  </section>


  <!-- =========================
       観劇記録 詳細画面
  ========================= -->

  <section
    class="detail-screen"
    id="detailScreen"
  >

    <button
      class="back-button"
      id="detailBackButton"
    >
      ‹ 戻る
    </button>

    <div id="detailContent"></div>

  </section>


  <script src="script.js"></script>

</body>
</html>
